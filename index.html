<!doctype html>
<html lang="tr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Image to full 3D in your browser: multi-view models, AI styles / T-pose / body completion, face &amp; hand detail, sculpting, rigging and animation. / Tarayıcıda görselden tam 3D: çok görünümlü modeller, AI stilleri / T-poz / gövde tamamlama, yüz ve el detayı, heykel, iskelet ve animasyon." />
    <meta name="theme-color" content="#0a0c10" />
    <title>3D Marker — Image to 3D</title>
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the saved theme (else the OS preference) / language before first paint (avoids a flash of the wrong theme).
      try {
        var s = JSON.parse(localStorage.getItem('3dmarker:settings') || '{}');
        if (s.theme === 'light' || s.theme === 'dark') document.documentElement.dataset.theme = s.theme;
        else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) document.documentElement.dataset.theme = 'light';
        if (s.lang === 'tr' || s.lang === 'en') document.documentElement.lang = s.lang;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
